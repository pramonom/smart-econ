    <!-- Logic JavaScript Utama -->
    <script>
        // Bank Soal Lengkap untuk Modul 1, 2, 3, dan 4
        const bankSoal = {
            m1: [
                {
                    q: "Jika seorang siswa memilih belajar ekonomi selama 2 jam daripada bekerja paruh waktu dengan upah Rp 50.000/jam, berapa biaya peluangnya?",
                    options: [
                        { text: "A. Rp 50.000", correct: false },
                        { text: "B. Rp 100.000 (Pendapatan potensial yang dilepas)", correct: true },
                        { text: "C. Rp 0 karena belajar itu gratis", correct: false }
                    ],
                    explanation: "Biaya peluang (opportunity cost) adalah nilai dari alternatif terbaik yang harus dikorbankan: 2 jam × Rp 50.000 = Rp 100.000."
                },
                {
                    q: "Apa inti utama dari permasalahan ekonomi yang dihadapi oleh setiap individu maupun negara?",
                    options: [
                        { text: "A. Kelangkaan sumber daya di tengah kebutuhan manusia yang tak terbatas", correct: true },
                        { text: "B. Terlalu banyaknya uang yang beredar di masyarakat", correct: false },
                        { text: "C. Kurangnya campur tangan pemerintah dalam menetapkan harga", correct: false }
                    ],
                    explanation: "Kelangkaan (scarcity) adalah masalah fundamental ekonomi: alat pemuas kebutuhan terbatas, sedangkan kebutuhan manusia tidak terbatas."
                }
            ],
            m2: [
                {
                    q: "Jika terjadi kemajuan teknologi otomatisasi pabrik yang menekan biaya produksi secara drastis, bagaimana dampaknya pada kurva penawaran?",
                    options: [
                        { text: "A. Kurva penawaran bergeser ke kanan (Supply bertambah pada setiap tingkat harga)", correct: true },
                        { text: "B. Kurva penawaran bergeser ke kiri", correct: false },
                        { text: "C. Terjadi pergerakan di sepanjang kurva tanpa adanya pergeseran", correct: false }
                    ],
                    explanation: "Faktor non-harga seperti kemajuan teknologi dan efisiensi biaya membuat produsen mampu memproduksi lebih banyak, sehingga kurva penawaran bergeser ke kanan."
                },
                {
                    q: "Berdasarkan Hukum Permintaan (ceteris paribus), jika harga suatu barang mengalami kenaikan, maka...",
                    options: [
                        { text: "A. Jumlah barang yang diminta konsumen akan menurun", correct: true },
                        { text: "B. Jumlah barang yang diminta konsumen akan meningkat drastis", correct: false },
                        { text: "C. Kurva permintaan langsung bergeser ke kanan atas", correct: false }
                    ],
                    explanation: "Hukum permintaan menyatakan hubungan terbalik antara tingkat harga (P) dan jumlah barang yang diminta (Qd) saat faktor lain dianggap konstan."
                }
            ],
            m3: [
                {
                    q: "Langkah kebijakan moneter kontraktif yang tepat diambil oleh Bank Sentral untuk meredam laju inflasi tinggi adalah...",
                    options: [
                        { text: "A. Menaikkan tingkat suku bunga acuan dan giro wajib minimum", correct: true },
                        { text: "B. Menurunkan suku bunga agar masyarakat mudah mengambil pinjaman", correct: false },
                        { text: "C. Mencetak uang baru dalam jumlah besar", correct: false }
                    ],
                    explanation: "Menaikkan suku bunga acuan menarik minat masyarakat untuk menabung dan menahan konsumsi/kredit, sehingga jumlah uang beredar berkurang dan inflasi terkendali."
                },
                {
                    q: "Komponen perhitungan Pendapatan Nasional (GDP/PDB) dengan pendekatan pengeluaran terdiri dari...",
                    options: [
                        { text: "A. Konsumsi (C) + Investasi (I) + Pengeluaran Pemerintah (G) + Ekspor Neto (X - M)", correct: true },
                        { text: "B. Upah + Sewa + Bunga + Laba Usaha", correct: false },
                        { text: "C. Total Pajak + Subsidi - Utang Luar Negeri", correct: false }
                    ],
                    explanation: "Rumus pendekatan pengeluaran adalah GDP = C + I + G + (X - M)."
                }
            ],
            m4: [
                {
                    q: "Ciri utama dari struktur Pasar Persaingan Sempurna yang membedakannya dengan Pasar Monopoli adalah...",
                    options: [
                        { text: "A. Penjual bertindak sebagai price taker dan barang yang dijual bersifat homogen", correct: true },
                        { text: "B. Terdapat hambatan tinggi (barriers to entry) untuk produsen baru masuk", correct: false },
                        { text: "C. Hanya ada satu produsen tunggal penentu harga pasar", correct: false }
                    ],
                    explanation: "Pada pasar persaingan sempurna, baik penjual maupun pembeli adalah penerima harga (price taker) karena banyaknya pelaku usaha dan produk yang seragam/homogen."
                },
                {
                    q: "Kondisi laba maksimum (profit maximization) bagi produsen tercapai saat...",
                    options: [
                        { text: "A. Pendapatan Marjinal sama dengan Biaya Marjinal (MR = MC)", correct: true },
                        { text: "B. Total Pendapatan sama dengan Total Biaya (TR = TC)", correct: false },
                        { text: "C. Biaya Rata-Rata (AC) mencapai titik tertinggi", correct: false }
                    ],
                    explanation: "Aturan emas maksimisasi keuntungan bagi perusahaan di struktur pasar mana pun adalah memproduksi pada tingkat output saat Pendapatan Marjinal sama dengan Biaya Marjinal (MR = MC)."
                }
            ]
        };

        // State index kuis aktif
        const quizState = { m1: 0, m2: 0, m3: 0, m4: 0 };

        // Fungsi Render Kuis Interaktif
        function loadQuiz(modulId) {
            const container = document.getElementById(`quiz-container-${modulId}`);
            if (!container) return;

            const listSoal = bankSoal[modulId];
            const currentIndex = quizState[modulId] % listSoal.length;
            const dataSoal = listSoal[currentIndex];

            let htmlOptions = '';
            dataSoal.options.forEach((opt, idx) => {
                htmlOptions += `
                    <button onclick="checkAnswer('${modulId}', ${idx})" 
                            id="btn-${modulId}-${idx}" 
                            class="w-full text-left p-2.5 rounded-lg bg-slate-950 border border-slate-800 text-xs hover:border-blue-500 transition mb-2">
                        ${opt.text}
                    </button>
                `;
            });

            container.innerHTML = `
                <p class="text-xs text-slate-200 font-semibold mb-3 leading-relaxed">${dataSoal.q}</p>
                <div class="space-y-1">${htmlOptions}</div>
                <div id="feedback-${modulId}" class="hidden p-3 rounded-lg text-xs mt-3 leading-relaxed"></div>
            `;

            // Geser index untuk klik tombol 'Soal Lainnya' berikutnya
            quizState[modulId]++;
        }

        // Fungsi Evaluasi Jawaban Kuis
        function checkAnswer(modulId, selectedIdx) {
            const listSoal = bankSoal[modulId];
            // Karena index sudah ditambah saat render, ambil index soal saat ini
            const activeIdx = (quizState[modulId] - 1 + listSoal.length) % listSoal.length;
            const dataSoal = listSoal[activeIdx];
            const feedbackEl = document.getElementById(`feedback-${modulId}`);

            dataSoal.options.forEach((opt, idx) => {
                const btn = document.getElementById(`btn-${modulId}-${idx}`);
                btn.disabled = true;
                if (opt.correct) {
                    btn.classList.add('bg-emerald-950/80', 'border-emerald-500', 'text-emerald-300');
                } else if (idx === selectedIdx) {
                    btn.classList.add('bg-red-950/80', 'border-red-500', 'text-red-300');
                }
            });

            feedbackEl.classList.remove('hidden');
            if (dataSoal.options[selectedIdx].correct) {
                feedbackEl.className = "p-3 rounded-lg text-xs mt-3 bg-emerald-950/90 text-emerald-300 border border-emerald-600 block";
                feedbackEl.innerHTML = `<strong>Benar!</strong> ${dataSoal.explanation}`;
            } else {
                feedbackEl.className = "p-3 rounded-lg text-xs mt-3 bg-red-950/90 text-red-300 border border-red-600 block";
                feedbackEl.innerHTML = `<strong>Kurang tepat.</strong> ${dataSoal.explanation}`;
            }
        }

        // LOGIKA GRAFIK PASAR & SIMULATOR HARGA
        const canvas = document.getElementById('marketCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('slider-harga');

        function updateMarket(price) {
            const p = parseFloat(price);
            // Fungsi Permintaan: Qd = 100 - 2P
            const qd = Math.max(0, 100 - (2 * p));
            // Fungsi Penawaran: Qs = 3P
            const qs = Math.max(0, 3 * p);

            document.getElementById('label-harga').innerText = `Rp ${p.toFixed(2)}`;
            document.getElementById('hasil-qd').innerText = `${qd.toFixed(0)} Unit`;
            document.getElementById('hasil-qs').innerText = `${qs.toFixed(0)} Unit`;

            const statusEl = document.getElementById('status-pasar');
            const explanationEl = document.getElementById('market-explanation');

            if (p === 20) {
                statusEl.className = "p-3 rounded-xl text-center text-xs font-bold bg-emerald-950/80 text-emerald-300 border border-emerald-700/50";
                statusEl.innerText = "STATUS: EKUILIBRIUM TERCAPAI (PASAR SEIMBANG)";
                explanationEl.innerHTML = `<strong>Analisis Grafik (P = Rp 20):</strong> Pasar berada pada titik temu seimbang. Jumlah permintaan konsumen setara dengan penawaran produsen pada kurva hijau (Q = 60).`;
            } else if (p > 20) {
                statusEl.className = "p-3 rounded-xl text-center text-xs font-bold bg-amber-950/80 text-amber-300 border border-amber-700/50";
                statusEl.innerText = "STATUS: SURPLUS PRODUSEN (KELEBIHAN PENAWARAN)";
                explanationEl.innerHTML = `<strong>Analisis Grafik (P = Rp ${p}):</strong> Harga terlalu tinggi. Penawaran produsen (Qs = ${qs}) melebihi permintaan konsumen (Qd = ${qd}), memicu penumpukan stok barang di pasar.`;
            } else {
                statusEl.className = "p-3 rounded-xl text-center text-xs font-bold bg-red-950/80 text-red-300 border border-red-700/50";
                statusEl.innerText = "STATUS: SHORTAGE (KELANGKAAN BARANG / KELEBIHAN PERMINTAAN)";
                explanationEl.innerHTML = `<strong>Analisis Grafik (P = Rp ${p}):</strong> Harga terlalu rendah. Permintaan konsumen melonjak (Qd = ${qd}) sedangkan penawaran produsen rendah (Qs = ${qs}), memicu antrean dan kelangkaan barang.`;
            }

            drawChart(p, qd, qs);
        }

        function drawChart(currentP, currentQd, currentQs) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;
            const pad = 45;

            // Grid Lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = pad; i < w - pad; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, pad);
                ctx.lineTo(i, h - pad);
                ctx.stroke();
            }
            for (let j = pad; j < h - pad; j += 40) {
                ctx.beginPath();
                ctx.moveTo(pad, j);
                ctx.lineTo(w - pad, j);
                ctx.stroke();
            }

            // Sumbu X & Y
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(pad, pad - 10);
            ctx.lineTo(pad, h - pad);
            ctx.lineTo(w - pad + 10, h - pad);
            ctx.stroke();

            // Label Sumbu
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px monospace';
            ctx.fillText('P (Harga)', pad - 35, pad);
            ctx.fillText('Q (Kuantitas)', w - pad - 30, h - pad + 25);

            // Kurva Demand (Merah)
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pad + 20, pad + 20);
            ctx.lineTo(w - pad - 20, h - pad - 20);
            ctx.stroke();
            ctx.fillStyle = '#f87171';
            ctx.fillText('Demand (D)', w - pad - 60, h - pad - 30);

            // Kurva Supply (Hijau Emerald Neon)
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pad + 20, h - pad - 20);
            ctx.lineTo(w - pad - 20, pad + 20);
            ctx.stroke();
            ctx.fillStyle = '#10b981';
            ctx.fillText('Supply (S)', w - pad - 60, pad + 30);

            // Garis Posisi Titik Harga Saat Ini
            const priceY = (h - pad) - ((currentP / 40) * (h - 2 * pad));
            ctx.strokeStyle = '#38bdf8';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(pad, priceY);
            ctx.lineTo(w - pad, priceY);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Event Listener & Inisialisasi Pertama
        slider.addEventListener('input', (e) => updateMarket(e.target.value));

        window.addEventListener('DOMContentLoaded', () => {
            loadQuiz('m1');
            loadQuiz('m2');
            loadQuiz('m3');
            loadQuiz('m4');
            updateMarket(20);
        });
    </script>
</body>
</html>
